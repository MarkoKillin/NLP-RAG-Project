[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chat"
version = "0.1.0"
description = "RAG chatbot with BM25 + vector search and Ollama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pydantic-ai-slim[openai]>=1.1",
    "pydantic-settings>=2.0",
    "requests>=2.32",
    "snowballstemmer>=3.0",
    "streamlit>=1.48",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rag*", "app*"]

[tool.setuptools.package-data]
rag = ["stopwords.txt"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "ruff",
]
