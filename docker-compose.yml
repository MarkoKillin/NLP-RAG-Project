services:
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-chatbot
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./index:/app/index
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL_NAME=${OLLAMA_MODEL_NAME:-hf.co/google/gemma-2b-it}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-hf.co/Snowflake/snowflake-arctic-embed-m-v1.5:BF16}
      # Query prefix for asymmetric embedders like arctic-embed; empty for symmetric.
      # The colon-less ${VAR-default} preserves an explicitly-set empty value.
      - "EMBEDDING_QUERY_PREFIX=${EMBEDDING_QUERY_PREFIX-Represent this sentence for searching relevant passages: }"
      - RAW_DATA_DIR=/app/data/raw
      - INDEX_DIR=/app/index
      - CHUNK_SIZE=${CHUNK_SIZE:-400}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-50}
      - TOP_K=${TOP_K:-5}
      - RRF_K=${RRF_K:-60}
      - HYBRID_CANDIDATE_MULTIPLIER=${HYBRID_CANDIDATE_MULTIPLIER:-4}
      - BM25_STEM=${BM25_STEM:-1}
      - BM25_REMOVE_STOPWORDS=${BM25_REMOVE_STOPWORDS:-0}
      # Rebuild after changing the embedding model, chunk size, or BM25 flags.
      # The app refuses to start on a mismatch rather than return wrong results.
      - REBUILD_INDEX=${REBUILD_INDEX:-0}
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - rag-network

volumes:
  ollama_data:

networks:
  rag-network:
    driver: bridge

