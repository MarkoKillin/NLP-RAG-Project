services:
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-chatbot
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./index:/app/index
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL_NAME=${OLLAMA_MODEL_NAME:-hf.co/google/gemma-2b-it}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-hf.co/Snowflake/snowflake-arctic-embed-m-v1.5:BF16}
      - RAW_DATA_DIR=/app/data/raw
      - INDEX_DIR=/app/index
      - CHUNK_SIZE=${CHUNK_SIZE:-400}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-50}
      - TOP_K=${TOP_K:-5}
      - BM25_STEM=${BM25_STEM:-1}
      - BM25_REMOVE_STOPWORDS=${BM25_REMOVE_STOPWORDS:-0}
      # Set to 1 to force a rebuild. You need this after changing
      # EMBEDDING_MODEL_NAME, CHUNK_SIZE, CHUNK_OVERLAP or either BM25_* flag,
      # since each index belongs to one set of those settings. On a mismatch the
      # app refuses to start instead of returning wrong results.
      - REBUILD_INDEX=${REBUILD_INDEX:-0}
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - rag-network

volumes:
  ollama_data:

networks:
  rag-network:
    driver: bridge

